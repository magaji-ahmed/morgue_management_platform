services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mortuary
      POSTGRES_PASSWORD: mortuary
      POSTGRES_DB: mortuary
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortuary"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mortuary:mortuary@db:5432/mortuary
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
